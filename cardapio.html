<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Açaí & Cia</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--y:#ffd21c;--p:#5b1f78;--bg:#fff9df}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#28162e}.hero{background:var(--y);text-align:center;padding:28px 15px}.hero h1{margin:0;color:var(--p);font-size:34px}.wrap{max-width:850px;margin:auto;padding:15px 15px 120px}.search{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}.search input{width:100%;padding:14px;border:1px solid #ddd;border-radius:15px;font-size:16px}.cat{background:#fff;padding:16px;border-radius:18px;margin:14px 0;box-shadow:0 4px 18px #0001}.cat h2{margin:0 0 10px;color:var(--p)}.item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;gap:10px}.item:last-child{border:0}.name{font-weight:bold}.price{color:var(--p);font-weight:900}.add{background:var(--p);color:white;border:0;border-radius:9px;padding:8px 12px;font-weight:bold}.cartbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(92%,600px);background:var(--p);color:white;padding:12px 15px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 25px #0005}.cartbar button{background:var(--y);border:0;border-radius:10px;padding:10px;font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:5}.modal.open{display:flex}.sheet{background:white;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.field{margin:10px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:bold}.primary{background:var(--p);color:white}.secondary{background:#eee}</style></head><body><header class="hero"><h1>🥤 Açaí & Cia</h1><p>Monte seu pedido do seu jeito 💜</p></header><main class="wrap"><div class="search"><input id="q" placeholder="🔎 Procurar produto..."></div><div id="menu">Carregando...</div></main><div class="cartbar"><span><b id="count">0 itens</b><br><span id="sum">R$ 0,00</span></span><button onclick="openCart()">Ver carrinho 🛒</button></div><div id="modal" class="modal"><div class="sheet"><div class="actions"><h2 style="flex:1">Seu pedido</h2><button class="secondary" onclick="closeCart()">Fechar</button></div><div id="cart"></div><h3>Total: <span id="total">R$ 0,00</span></h3><div class="field"><label>Nome</label><input id="customer"></div><div class="field"><label>Endereço</label><textarea id="address" rows="2"></textarea></div><div class="field"><label>Pagamento</label><select id="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></div><div class="field"><label>Observações</label><textarea id="obs" rows="2"></textarea></div><div class="actions"><button class="secondary" onclick="closeCart()">Continuar</button><button class="primary" onclick="send()">Enviar WhatsApp 📲</button></div></div></div><script src="config.js"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let products=[],cart=[];const $=x=>document.getElementById(x),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){let q=$('q').value.toLowerCase(),g={};products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q)).forEach(p=>(g[p.category]??=[]).push(p));$('menu').innerHTML=Object.entries(g).map(([c,ps])=>`<section class="cat"><h2>${esc(c)}</h2>${ps.map(p=>`<div class="item"><span class="name">${esc(p.name)}</span><span>${p.price>0?`<b class="price">${money(p.price)}</b>`:''} <button class="add" onclick="add('${p.id}')">+</button></span></div>`).join('')}</section>`).join('')||'<p>Nenhum produto encontrado.</p>'}function add(id){let p=products.find(x=>x.id===id),i=cart.find(x=>x.id===id);i?i.qty++:cart.push({id,name:p.name,price:+p.price,qty:1});update()}function rem(id){let i=cart.findIndex(x=>x.id===id);if(i<0)return;if(--cart[i].qty<=0)cart.splice(i,1);update()}function update(){let n=cart.reduce((a,x)=>a+x.qty,0),t=cart.reduce((a,x)=>a+x.price*x.qty,0);$('count').textContent=n+(n===1?' item':' itens');$('sum').textContent=money(t);$('total').textContent=money(t);$('cart').innerHTML=cart.map(x=>`<div class="line"><span>${x.qty}x ${esc(x.name)}</span><span>${money(x.price*x.qty)} <button onclick="rem('${x.id}')">−</button></span></div>`).join('')||'<p>Carrinho vazio.</p>'}function openCart(){$('modal').classList.add('open');update()}function closeCart(){$('modal').classList.remove('open')}function send(){if(!cart.length)return alert('Adicione um item.');let n=$('customer').value.trim(),a=$('address').value.trim();if(!n||!a)return alert('Preencha nome e endereço.');let t=cart.reduce((s,x)=>s+x.price*x.qty,0),txt='*NOVO PEDIDO — AÇAÍ & CIA*\n\nCliente: '+n+'\nEndereço: '+a+'\nPagamento: '+$('payment').value+'\n\nItens:\n'+cart.map(x=>x.qty+'x '+x.name+' — '+money(x.price*x.qty)).join('\n')+'\n\n*Total: '+money(t)+'*';if($('obs').value)txt+='\nObs.: '+$('obs').value;location.href='https://wa.me/5521973145934?text='+encodeURIComponent(txt)}async function load(){let r=await sb.from('products').select('*').eq('active',true).order('category').order('sort_order').order('name');if(r.error){$('menu').textContent='Erro ao carregar o cardápio.';return}products=r.data||[];render()}$('q').oninput=render;load();update();</script></body></html>
