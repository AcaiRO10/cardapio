<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Açaí & Cia</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--y:#ffd814;--p:#5d176e;--m:#747474;--soft:#fff9d8}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#171717}.hidden{display:none!important}
.hero{background:#ffc900}.hero img{width:100%;max-height:210px;object-fit:cover;display:block}.wrap{max-width:760px;margin:auto;padding:0 16px 105px}
.top{position:sticky;top:0;background:white;z-index:10;padding:10px 0}.search{width:100%;border:0;background:#f3f3f5;padding:14px;border-radius:15px}.tabs{display:flex;gap:8px;overflow:auto;padding-top:9px}.tab{border:0;border-radius:14px;padding:10px 14px;white-space:nowrap;font-weight:800}.tab.on{background:#fff0a3}
h2{font-size:25px;margin:25px 0 10px}.prod{display:grid;grid-template-columns:1fr 120px;gap:14px;padding:15px 0;border-bottom:1px solid #eee}.prod h3{margin:0 0 7px;font-size:20px}.prod p{color:var(--m);margin:0 0 10px}.price{font-size:20px;font-weight:900}.pic{width:120px;height:120px;border-radius:18px;background:#ffe46c;display:flex;align-items:center;justify-content:center;font-size:43px;object-fit:cover}
.photo{position:relative}.plus{position:absolute;right:4px;bottom:4px;width:44px;height:44px;border:4px solid white;border-radius:14px;background:var(--y);font-size:27px;font-weight:bold}
.cartbar,.sticky{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:white;padding:12px 16px;z-index:40;border-top:1px solid #eee}.mainbtn{width:100%;border:0;border-radius:15px;background:var(--y);padding:15px;font-size:18px;font-weight:900}
.overlay{position:fixed;inset:0;background:#0006;z-index:50}.sheet{position:fixed;inset:3vh 0 0;max-width:760px;margin:auto;background:white;z-index:51;border-radius:24px 24px 0 0;overflow:auto;padding-bottom:95px}.head{position:sticky;top:0;background:white;padding:16px;display:flex;align-items:center;gap:12px;z-index:3;border-bottom:1px solid #eee}.x{border:0;border-radius:11px;width:40px;height:40px;font-size:25px}.body{padding:14px}.group{background:var(--soft);border-radius:19px;padding:15px;margin-bottom:13px}.group h3{margin:0 0 5px}.hint{color:var(--m);margin-bottom:8px}.req{float:right;background:var(--y);padding:5px 8px;border-radius:999px;font-size:12px}.opt{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #0000000b}.opt input{width:20px;height:20px;accent-color:var(--p)}.grow{flex:1}.counter{font-size:12px;font-weight:800;background:#fff1a5;padding:5px 8px;border-radius:999px;display:inline-block}
.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px}.cartitem{padding:13px 0;border-bottom:1px solid #eee}.mini{font-size:14px;line-height:1.45;color:#555}.total{background:#f5f5f5;border-radius:15px;padding:13px}.row{display:flex;justify-content:space-between;margin:7px 0}.grand{font-size:21px;font-weight:900}
</style></head><body>
<div class="hero"><img src="assets/marca.png"></div><div class="wrap"><div class="top"><input id="q" class="search" placeholder="🔎 Pesquisar itens na loja"><div class="tabs"><button class="tab on" data-id="promo">🔥 Promoções</button><button class="tab" data-id="cups">🥤 Monte seu copo</button><button class="tab" data-id="snacks">🥐 Salgados</button><button class="tab" data-id="drinks">🥤 Bebidas</button></div></div><div id="catalog"></div></div>
<div class="cartbar"><button id="cartBtn" class="mainbtn" disabled>Seu carrinho está vazio</button></div><div id="ov" class="overlay hidden"></div><div id="sheet" class="sheet hidden"></div><div id="sticky" class="sticky hidden"></div>
<script>
const $=x=>document.getElementById(x),M=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),WA='5521973145934';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const A=['Natural Artesanal','Morango Artesanal','Banana Artesanal','Natural Cremoso','Morango Cremoso','Banana Cremoso','Cupuaçu','Ninho','Óreo','Kinder Ovo','Ferrero Rocher','Brownie','Ovomaltine','Prestígio','Nutella','Rafaello'];
const S=['Chocolate','Morango','Coco','Maracujá','Abacaxi','Flocos','Chiclete','Blue ice','Pistache','Sensação','Chocomenta','Ninho c/ Nutella','Yogurt','Passas ao Rum','Creme','Rafaello','Pavê'];
const C=['Leite em pó','Paçoca','Amendoim','Granola','Aveia','Chocoboll','Sucrilhos','Coco ralado','Granulado preto','Granulado colorido','Flocos de arroz','Jujuba','Amendoim colorido'];
const T=['Leite condensado','Chocolate','Morango','Tutti-frutti','Menta','Mel','Caramelo','Doce de leite','Cassis','Açaí','Amendoim','Limão','Maracujá','Abacaxi','Banana','Uva'];
const E=['Creme de Ninho','Creme de avelã','Creme de pistache','Creme de choc. ao leite','Creme de choc. branco','Doce de Leite','Chantilly','Ouro Branco','Sonho de Valsa','Banana','Kit Kat','Gotas de chocolate'];
const sizes=[['300ml',12],['400ml',15],['500ml',17],['700ml',22],['1100ml',28],['5 Litros',112]];
const snacks=['Italiano de queijo e presunto','Italiano de cebola','Italiano de frango com catupiry','Italiano de calabresa com queijo','Pastel de forno de frango','Hambúrguer com cheddar'];
const drinks=[['Coca-Cola Original 350ml',7.5],['Fanta Uva 350ml',7.5],['Guaraná Antarctica 350ml',7.5],['Guaravita 290ml',3.5]];
let cart=[],delivery={ok:false,lat:0,lng:0,d:0,fee:0};
function card(t,d,p,k,key,img=''){return `<div class="prod searchable" data-s="${(t+' '+d).toLowerCase()}" onclick="openP('${k}','${key}')"><div><h3>${t}</h3><p>${d}</p><div class="price">${M(p)}</div></div><div class="photo">${img?`<img class="pic" src="${img}">`:`<div class="pic">${k==='snack'?'🥐':k==='drink'?'🥤':'🍧'}</div>`}<button class="plus">+</button></div></div>`}
function render(){let h=`<section id="promo"><h2>🔥 Promoções</h2>${card('2 copos de 300ml','Monte o Copo 1 e o Copo 2 separadamente.',19.99,'double','0','assets/acai_dobro.png')}${card('1 salgado + açaí 400ml','Escolha o salgado e monte o açaí completo.',23.99,'combo','0')}</section><section id="cups"><h2>🥤 Monte seu copo</h2>`;sizes.forEach((x,i)=>h+=card('Açaí ou Sorvete '+x[0],'Escolha até 2 sabores, 5 complementos e 2 coberturas.',x[1],'cup',i));h+=`</section><section id="snacks"><h2>🥐 Salgados</h2>`;snacks.forEach((x,i)=>h+=card(x,'Escolha de 1 a 3 molhos.',11.99,'snack',i));h+=`</section><section id="drinks"><h2>🥤 Bebidas</h2>`;drinks.forEach((x,i)=>h+=card(x[0],'Bebida gelada.',x[1],'drink',i));h+='</section>';$('catalog').innerHTML=h}
function opts(title,arr,name,max,req=true,priceFn=null){return `<div class="group"><h3>${title}${req?'<span class="req">Obrigatório</span>':''}</h3><div class="hint">${req?'Selecione':'Escolha'} até ${max}</div><span class="counter" data-c="${name}" data-max="${max}">0 de ${max} selecionados</span>${arr.map((x,i)=>`<label class="opt"><input type="${max===1?'radio':'checkbox'}" name="${name}" value="${x}" data-max="${max}"><span class="grow">${x}</span>${priceFn?`<b>+${M(priceFn(x,i))}</b>`:''}</label>`).join('')}</div>`}
function cup(p,title){return `<h2>${title}</h2>${opts('Sabores',[...A,...S],p+'f',2,true)}<div class="group"><h3>Como deseja os complementos?<span class="req">Obrigatório</span></h3><label class="opt"><input type="radio" name="${p}w" value="Dentro do copo"><span class="grow">Dentro do copo</span></label><label class="opt"><input type="radio" name="${p}w" value="Separados"><span class="grow">Separados</span><b>+${M(4)}</b></label></div>${opts('Complementos',C,p+'c',5,false)}${opts('Coberturas',T,p+'t',2,false)}${opts('Adicionais',E,p+'e',99,false,()=>5)}<div class="field"><label>Observações deste copo</label><textarea name="${p}o"></textarea></div>`}
function snack(p,choose){return `${choose?opts('Escolha seu salgado',snacks,p+'n',1,true):''}${opts('Molhos',['Ketchup','Maionese','Maionese Temperada','Sem Molho'],p+'m',3,true)}${opts('Turbine seu lanche',drinks.map(x=>x[0]),p+'d',3,false,x=>drinks.find(y=>y[0]===x)[1])}<div class="field"><label>Observações do salgado</label><textarea name="${p}o"></textarea></div>`}
function openP(k,key){let title='',base=0,b='';if(k==='cup'){title='Açaí ou Sorvete '+sizes[key][0];base=sizes[key][1];b=cup('c',title)}if(k==='double'){title='2 copos de 300ml';base=19.99;b=cup('a','Copo 1')+cup('b','Copo 2')}if(k==='combo'){title='1 salgado + açaí 400ml';base=23.99;b=cup('c','Açaí 400ml')+snack('s',true)}if(k==='snack'){title=snacks[key];base=11.99;b=snack('s',false)}if(k==='drink'){title=drinks[key][0];base=drinks[key][1];b=`<div class="group"><h3>${title}</h3><p>Adicionar ao carrinho?</p></div>`}$('ov').classList.remove('hidden');$('sheet').classList.remove('hidden');$('sticky').classList.remove('hidden');$('sheet').dataset.base=base;$('sheet').innerHTML=`<div class="head"><button class="x" onclick="closeS()">×</button><b>${title}</b></div><div class="body">${b}</div>`;$('sticky').innerHTML=`<button class="mainbtn" onclick="add('${k}','${key}',${base})">Adicionar • <span id="live">${M(base)}</span></button>`;bind();live()}
function closeS(){$('ov').classList.add('hidden');$('sheet').classList.add('hidden');$('sticky').classList.add('hidden')}$('ov').onclick=closeS;
function vals(n){return [...document.querySelectorAll(`[name="${n}"]:checked`)].map(x=>x.value)}function val(n){return document.querySelector(`[name="${n}"]:checked`)?.value||''}
function bind(){document.querySelectorAll('#sheet input').forEach(e=>e.onchange=()=>{let max=+e.dataset.max||0;if(max>1&&vals(e.name).length>max){e.checked=false;alert('Escolha no máximo '+max+'.')}if(e.name.endsWith('m')&&e.checked){if(e.value==='Sem Molho')document.querySelectorAll(`[name="${e.name}"]`).forEach(x=>{if(x!==e)x.checked=false});else document.querySelectorAll(`[name="${e.name}"][value="Sem Molho"]`).forEach(x=>x.checked=false)}document.querySelectorAll('[data-c]').forEach(c=>c.textContent=`${vals(c.dataset.c).length} de ${c.dataset.max} selecionados`);live()})}
function extras(){let x=0;document.querySelectorAll('[name$="w"]:checked').forEach(e=>{if(e.value==='Separados')x+=4});document.querySelectorAll('[name$="e"]:checked').forEach(()=>x+=5);document.querySelectorAll('[name$="d"]:checked').forEach(e=>x+=drinks.find(d=>d[0]===e.value)?.[1]||0);return x}function live(){if($('live'))$('live').textContent=M(+$('sheet').dataset.base+extras())}
function readCup(p){let f=vals(p+'f'),w=val(p+'w');if(!f.length||!w){alert('Escolha pelo menos 1 sabor e como deseja os complementos.');return null}return{f,w,c:vals(p+'c'),t:vals(p+'t'),e:vals(p+'e'),o:document.querySelector(`[name="${p}o"]`)?.value.trim()||''}}
function readSnack(p,choose){let n=choose?val(p+'n'):'',m=vals(p+'m');if(choose&&!n){alert('Escolha o salgado.');return null}if(!m.length){alert('Escolha os molhos ou Sem Molho.');return null}return{n,m,d:vals(p+'d'),o:document.querySelector(`[name="${p}o"]`)?.value.trim()||''}}
function add(k,key,base){let z={};if(k==='cup'){z.cups=[readCup('c')];if(!z.cups[0])return}if(k==='double'){z.cups=[readCup('a'),readCup('b')];if(z.cups.some(x=>!x))return}if(k==='combo'){z.cups=[readCup('c')];if(!z.cups[0])return;z.sn=readSnack('s',true);if(!z.sn)return}if(k==='snack'){z.sn=readSnack('s',false);if(!z.sn)return;z.sn.n=snacks[key]}if(k==='drink')z.dr=drinks[key][0];let title=k==='cup'?'Açaí ou Sorvete '+sizes[key][0]:k==='double'?'2 copos de 300ml':k==='combo'?'1 salgado + açaí 400ml':k==='snack'?snacks[key]:drinks[key][0];cart.push({id:crypto.randomUUID(),title,total:+base+extras(),z});closeS();bar()}
function bar(){let n=cart.length,t=cart.reduce((a,x)=>a+x.total,0);$('cartBtn').disabled=!n;$('cartBtn').textContent=n?`Ver carrinho • ${n} ${n===1?'item':'itens'} • ${M(t)}`:'Seu carrinho está vazio'}
function cupText(c){return `🍨 *Sabores:* ${c.f.join(' + ')}
📦 *Complementos:* ${c.w}
• ${c.c.length?c.c.join('\\n• '):'Nenhum'}
🍫 *Coberturas:* ${c.t.length?c.t.join(', '):'Nenhuma'}
⭐ *Adicionais:* ${c.e.length?c.e.join(', '):'Nenhum'}${c.o?`
📝 *Obs.:* ${c.o}`:''}`}
$('cartBtn').onclick=cartView;
function cartView(){$('ov').classList.remove('hidden');$('sheet').classList.remove('hidden');$('sticky').classList.add('hidden');let h=cart.map((x,i)=>`<div class="cartitem"><b>${i+1}. ${x.title} — ${M(x.total)}</b><div class="mini">${x.z.cups?x.z.cups.map((c,j)=>`<br><b>${x.z.cups.length>1?'Copo '+(j+1):'Copo'}</b><br>${cupText(c).replaceAll('\\n','<br>')}`).join(''):''}${x.z.sn?`<br><b>Salgado:</b> ${x.z.sn.n}<br><b>Molhos:</b> ${x.z.sn.m.join(', ')}<br><b>Bebidas:</b> ${x.z.sn.d.join(', ')||'Nenhuma'}`:''}${x.z.dr?'<br>'+x.z.dr:''}</div><button onclick="del('${x.id}')">Remover</button></div>`).join('');let sub=cart.reduce((a,x)=>a+x.total,0);$('sheet').innerHTML=`<div class="head"><button class="x" onclick="closeS()">×</button><b>Seu pedido</b></div><div class="body">${h}<div class="field"><label>Nome</label><input id="name"></div><div class="field"><label>Endereço completo</label><textarea id="addr"></textarea></div><button class="mainbtn" onclick="geo()">📍 Usar minha localização</button><div id="geoStatus" class="mini">${delivery.ok?`${delivery.d.toFixed(2).replace('.',',')} km • ${M(delivery.fee)}`:'Calcule a taxa de entrega pela localização.'}</div><div class="field"><label>Pagamento</label><select id="pay" onchange="troco()"><option></option><option>Pix</option><option>Dinheiro</option><option>Cartão na entrega</option></select></div><div id="change" class="field hidden"><label>Troco para quanto?</label><input id="changeFor" type="number" step=".01"></div><div class="field"><label>Observações gerais</label><textarea id="obs"></textarea></div><div class="total"><div class="row"><span>Subtotal</span><b>${M(sub)}</b></div><div class="row"><span>Entrega</span><b>${delivery.ok?M(delivery.fee):'—'}</b></div><div class="row grand"><span>Total</span><span>${M(sub+(delivery.ok?delivery.fee:0))}</span></div></div><button class="mainbtn" onclick="send()">Enviar pedido pelo WhatsApp</button></div>`}
function del(id){cart=cart.filter(x=>x.id!==id);bar();cart.length?cartView():closeS()}function troco(){$('change').classList.toggle('hidden',$('pay').value!=='Dinheiro')}
function geo(){if(!navigator.geolocation)return alert('GPS indisponível.');$('geoStatus').textContent='Obtendo localização...';navigator.geolocation.getCurrentPosition(async p=>{let lat=p.coords.latitude,lng=p.coords.longitude,{data,error}=await sb.rpc('calculate_delivery_fee',{customer_lat:lat,customer_lng:lng});if(error)return $('geoStatus').textContent='Erro ao calcular.';delivery={ok:true,lat,lng,d:+data.distance_km,fee:+data.fee};cartView()},()=>$('geoStatus').textContent='Permita o acesso à localização.',{enableHighAccuracy:true,timeout:12000})}
function itemMsg(x,i){let s=`━━━━━━━━━━━━━━
*ITEM ${i+1} — ${x.title.toUpperCase()}*
💰 ${M(x.total)}
`;if(x.z.cups)x.z.cups.forEach((c,j)=>s+=`
🥤 *${x.z.cups.length>1?'COPO '+(j+1):'COPO'}*
${cupText(c)}
`);if(x.z.sn)s+=`
🥐 *SALGADO*
• ${x.z.sn.n}
🥫 *Molhos:* ${x.z.sn.m.join(', ')}
🥤 *Bebida adicional:* ${x.z.sn.d.join(', ')||'Nenhuma'}${x.z.sn.o?`
📝 *Obs.:* ${x.z.sn.o}`:''}
`;if(x.z.dr)s+=`
🥤 ${x.z.dr}
`;return s}
function send(){let name=$('name').value.trim(),addr=$('addr').value.trim(),pay=$('pay').value,obs=$('obs').value.trim();if(!name||!addr||!pay)return alert('Preencha nome, endereço e pagamento.');if(!delivery.ok)return alert('Calcule a entrega pela localização.');let sub=cart.reduce((a,x)=>a+x.total,0),tot=sub+delivery.fee,text=`🟣 *NOVO PEDIDO — AÇAÍ & CIA*

👤 *Cliente:* ${name}
📍 *Endereço:* ${addr}
🗺️ *Localização:* https://www.google.com/maps?q=${delivery.lat},${delivery.lng}
`;cart.forEach((x,i)=>text+='\n'+itemMsg(x,i));text+=`
━━━━━━━━━━━━━━
💳 *PAGAMENTO*
Forma: ${pay}`;if(pay==='Dinheiro'&&+$('changeFor').value){let cf=+$('changeFor').value;text+=`
Troco para: ${M(cf)}
Levar troco: ${M(Math.max(0,cf-tot))}`}text+=`

🧾 *RESUMO*
Subtotal: ${M(sub)}
Entrega (${delivery.d.toFixed(2).replace('.',',')} km): ${M(delivery.fee)}
*TOTAL: ${M(tot)}*${obs?`

📝 *Observações gerais:* ${obs}`:''}`;window.open(`https://wa.me/${WA}?text=${encodeURIComponent(text)}`,'_blank')}
$('q').oninput=e=>document.querySelectorAll('.searchable').forEach(x=>x.classList.toggle('hidden',!x.dataset.s.includes(e.target.value.toLowerCase())));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.id).scrollIntoView({behavior:'smooth'})});render();bar();
</script></body></html>
